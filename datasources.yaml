apiVersion: 1

datasources:
  # Reads Container Apps / SAP VM metrics natively from Azure Monitor.
  # Auth is via the Container App's system-assigned managed identity —
  # no secrets stored here at all.
  - name: Azure Monitor
    type: grafana-azure-monitor-datasource
    access: proxy
    isDefault: true
    jsonData:
      azureAuthType: msi
      cloudName: azuremonitor
    editable: true

  # Generic REST/GraphQL connector used for Cloudflare Analytics API and
  # the GitHub API (commits, Actions workflow runs).
  # SECURITY NOTE: auth tokens are intentionally NOT set here. After first
  # login, add your GitHub PAT / Cloudflare API token under
  # Connections > Data sources > Infinity > Auth, so secrets never sit in
  # a file that could end up in source control.
  - name: Infinity
    type: yesoreyeram-infinity-datasource
    access: proxy
    editable: true
    jsonData:
      auth_method: none
